<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luffy vs Katakuri - Showdown Intro</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      background: black;
      color: white;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.4);
    }

    .intro-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    .intro-text h1 {
      font-size: 4em;
      margin: 0;
      color: crimson;
      text-shadow: 0 0 10px red;
    }

    .intro-text p {
      font-size: 1.5em;
      margin-top: 15px;
      color: #eee;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video class="bg-video" autoplay muted loop>
    <source src="https://cdn.pixabay.com/video/2023/07/13/173328-842947317_large.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Text Overlay -->
  <div class="intro-text">
    <h1>Luffy vs Katakuri</h1>
    <p>Clash of Observation Haki Legends</p>
  </div>

  <!-- Sound Effect -->
  <audio autoplay>
    <source src="https://actions.google.com/sounds/v1/impacts/fighting_whoosh.ogg" type="audio/ogg">
  </audio>

</body>
</html>
